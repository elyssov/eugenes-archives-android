<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Eugene's Archives — Reader</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <button class="hamburger" onclick="toggleSidebar()" aria-label="Menu">
    <span></span><span></span><span></span>
  </button>

  <!-- Floating font + theme controls — always accessible without opening sidebar -->
  <div class="floating-font">
    <button onclick="changeFontSize(-1)" aria-label="Smaller text">A−</button>
    <button onclick="changeFontSize(1)" aria-label="Larger text">A+</button>
    <button onclick="openThemeSheet()" aria-label="Reading theme" title="Reading theme">🎨</button>
  </div>

  <!-- Theme picker — bottom sheet with six previews -->
  <div class="theme-sheet-overlay" id="themeSheetOverlay" onclick="closeThemeSheet()"></div>
  <div class="theme-sheet" id="themeSheet">
    <h3 id="themeSheetTitle">Reading theme</h3>
    <div class="theme-grid">
      <div class="theme-card preview-night" data-theme="night" onclick="setTheme('night')">
        <span class="name">Night</span>
        <span class="sample">Cream on midnight</span>
      </div>
      <div class="theme-card preview-sepia" data-theme="sepia" onclick="setTheme('sepia')">
        <span class="name">Sepia</span>
        <span class="sample">Like paper, in sun</span>
      </div>
      <div class="theme-card preview-light" data-theme="light" onclick="setTheme('light')">
        <span class="name">Light</span>
        <span class="sample">Clean, daylight</span>
      </div>
      <div class="theme-card preview-solarized" data-theme="solarized" onclick="setTheme('solarized')">
        <span class="name">Solarized</span>
        <span class="sample">Easy on the eye</span>
      </div>
      <div class="theme-card preview-manuscript" data-theme="manuscript" onclick="setTheme('manuscript')">
        <span class="name">Manuscript</span>
        <span class="sample">Gold on black, like old codex</span>
      </div>
      <div class="theme-card preview-notebook" data-theme="notebook" onclick="setTheme('notebook')">
        <span class="name">Notebook</span>
        <span class="sample">Blue ink on paper</span>
      </div>
    </div>
  </div>

  <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

  <aside class="sidebar">
    <div class="sidebar-header">
      <a href="index.html" class="back-to-catalog">Back to Library</a>
      <h1 id="readerTitle">Loading...</h1>
      <div class="subtitle" id="readerSubtitle"></div>
    </div>

    <div class="sidebar-nav"></div>

    <div class="sidebar-footer">
      <div class="font-controls">
        <span class="font-label">Font</span>
        <button class="font-btn" onclick="changeFontSize(-1)">A−</button>
        <button class="font-btn" onclick="changeFontSize(1)">A+</button>
        <button class="lang-btn" onclick="app.switchLang()" title="Switch language"><span class="lang-flag"></span></button>
      </div>
      <div class="progress-bar"><div class="progress-fill"></div></div>
      <div class="progress-text">Cover</div>
    </div>
  </aside>

  <main class="reader">
    <div class="reader-content"></div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
    <img id="lightboxImg" src="" alt="">
  </div>

  <script src="embedded_data.js"></script>
  <script src="app.js"></script>
  <script>
    function openLightbox(src) {
      var lb = document.getElementById('lightbox');
      var img = document.getElementById('lightboxImg');
      img.src = src;
      lb.classList.add('active');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      var lb = document.getElementById('lightbox');
      lb.classList.remove('active');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') closeLightbox();
    });
    // Delegate clicks on images inside reader
    document.addEventListener('click', function(e) {
      var img = e.target;
      if (img.tagName === 'IMG' && img.closest('.reader-content')) {
        e.preventDefault();
        openLightbox(img.src);
      }
    });

    // ===== READING THEME PICKER =====
    var THEMES = ['night', 'sepia', 'light', 'solarized', 'manuscript', 'notebook'];

    function applyThemeClass(name) {
      var body = document.body;
      THEMES.forEach(function(t) { body.classList.remove('theme-' + t); });
      // 'night' is the default — no class needed
      if (name && name !== 'night') body.classList.add('theme-' + name);
      // Mark the active card in the picker
      var cards = document.querySelectorAll('.theme-card');
      cards.forEach(function(c) {
        c.classList.toggle('active-theme', c.getAttribute('data-theme') === name);
      });
    }

    function setTheme(name) {
      if (THEMES.indexOf(name) < 0) name = 'night';
      try { localStorage.setItem('aeliss-theme', name); } catch (e) {}
      applyThemeClass(name);
      // Small delay so the user sees the swap, then close the sheet
      setTimeout(closeThemeSheet, 160);
    }

    window.openThemeSheet = function() {
      document.getElementById('themeSheetOverlay').classList.add('active');
      document.getElementById('themeSheet').classList.add('active');
    };
    window.closeThemeSheet = function() {
      document.getElementById('themeSheetOverlay').classList.remove('active');
      document.getElementById('themeSheet').classList.remove('active');
    };
    window.setTheme = setTheme;

    // Restore saved theme on load
    (function () {
      var saved = 'night';
      try { saved = localStorage.getItem('aeliss-theme') || 'night'; } catch (e) {}
      applyThemeClass(saved);
    })();
  </script>
</body>
</html>
